# SPDX-License-Identifier: GPL-3.0-or-later
# One-off probe for ADR 0002: how to get the stock Android image without
# Google's Linux-only fetch tool, so gamedroid can download it itself on any
# host. Tries the public build website's own download addresses with plain
# HTTPS and no API key, and lists what the archive contains. (The older API
# the first version of this probe tried now answers 403: it has been retired.)
name: probe-image-download
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/probe-image-download.yml"
permissions:
  contents: write
env:
  BRANCH: aosp-android-latest-release
  TARGET: aosp_cf_x86_64_only_phone-userdebug
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Probe the public website's addresses (no API key)
        run: |
          set +e
          mkdir -p out && exec > >(tee out/probe-linux.txt) 2>&1
          SITE=https://ci.android.com/builds
          echo "=== latest build of the branch, by redirect"
          curl -sS -o /dev/null -D - "$SITE/latest/branches/$BRANCH/targets/$TARGET/view/BUILD_INFO" | grep -iE '^HTTP|^location' | cut -c1-200
          LOC=$(curl -sS -o /dev/null -w '%{redirect_url}' "$SITE/latest/branches/$BRANCH/targets/$TARGET/view/BUILD_INFO")
          echo "redirect: ${LOC:0:160}"
          BUILD=$(echo "$LOC" | sed -n 's#.*/submitted/\([0-9]*\)/.*#\1#p')
          echo "BUILD=$BUILD"
          [ -n "$BUILD" ] || BUILD=16644040
          ZIP="aosp_cf_x86_64_only_phone-img-$BUILD.zip"
          for form in "submitted/$BUILD/$TARGET/latest/raw/$ZIP" "submitted/$BUILD/$TARGET/latest/$ZIP" "submitted/$BUILD/$TARGET/latest/view/$ZIP"; do
            echo "=== $form"
            curl -sS -o /dev/null -D - "$SITE/$form" | grep -iE '^HTTP|^location|^content-type|^content-length' | sed -E 's/(X-Goog-[A-Za-z]*=)[^&]*/\1.../g' | cut -c1-220
          done
          echo "=== download through the raw form, following redirects"
          curl -sS -L -o img.zip -w 'http=%{http_code} bytes=%{size_download} seconds=%{time_total} type=%{content_type}\n' "$SITE/submitted/$BUILD/$TARGET/latest/raw/$ZIP"
          ls -la img.zip; head -c 4 img.zip | xxd -p
          echo "=== archive contents"
          unzip -l img.zip | head -40
          mkdir img && cd img && unzip -q ../img.zip
          echo "=== sparse or plain"
          python3 - <<'PY'
          import struct,glob,os
          for f in sorted(glob.glob('*.img')):
              h=open(f,'rb').read(28)
              if h[:4]==bytes.fromhex('3aff26ed'):
                  magic,maj,minr,fhs,chs,blk,total_blks,chunks,crc=struct.unpack('<IHHHHIIII',h)
                  print(f,os.path.getsize(f),'bytes SPARSE v%d.%d block=%d blocks=%d chunks=%d -> %d bytes raw'%(maj,minr,blk,total_blks,chunks,blk*total_blks))
              else:
                  print(f,os.path.getsize(f),'bytes, not sparse, starts',h[:8])
          PY
      - name: Publish
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tools/ci/publish-logs.sh probe-image out/probe-linux.txt
