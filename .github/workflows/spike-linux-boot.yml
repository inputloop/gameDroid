# SPDX-License-Identifier: GPL-3.0-or-later
# Phase 0 spike, throwaway. Can a prebuilt Cuttlefish image boot under KVM on a
# GitHub Linux runner? No GPU here, so this tests the VMM path only, with
# software rendering. Exploratory: steps log as much as they can and the job
# keeps going after failures so one run teaches the most.
name: spike-linux-boot
on:
  workflow_dispatch:  # manual only, to spare Actions minutes
permissions:
  contents: read
jobs:
  boot:
    runs-on: ubuntu-24.04  # cuttlefish-base 1.57.14 does not install on 26.04 (libxml2 dependency)
    timeout-minutes: 45
    steps:
      - name: Free disk space (run 2 failed 0.2 GB short for userdata)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Allow unprivileged user namespaces (run 3, crosvm sandbox failed on unshare)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
      - name: Open /dev/kvm to the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm && echo "KVM_ACCESS=ok"
      - name: Install Cuttlefish host packages from Google's apt repository
        continue-on-error: true
        run: |
          sudo curl -fsSL https://us-apt.pkg.dev/doc/repo-signing-key.gpg -o /etc/apt/trusted.gpg.d/artifact-registry.asc
          echo "deb https://us-apt.pkg.dev/projects/android-cuttlefish-artifacts android-cuttlefish main" | sudo tee /etc/apt/sources.list.d/artifact-registry.list
          sudo apt-get update
          apt-cache policy cuttlefish-base cuttlefish-user
          sudo apt-get install -y cuttlefish-base cuttlefish-user
          sudo usermod -aG kvm,cvdnetwork,render "$USER"
          dpkg -l | grep -i cuttlefish || true
          sudo systemctl restart cuttlefish-host-resources || true
          systemctl --no-pager status cuttlefish-host-resources | head -15 || true
          ip -br link | head -20
      - name: Record tool help (launch flags are not confirmed by docs we read)
        continue-on-error: true
        run: |
          which cvd launch_cvd fetch_cvd || true
          cvd version || true
          cvd help 2>&1 | head -60 || true
          cvd fetch --help 2>&1 | grep -iE 'default_build|target_directory|branch' | head -20 || true
      - name: Fetch prebuilt image
        continue-on-error: true
        run: |
          mkdir -p "$HOME/cf" && cd "$HOME/cf"
          df -h .
          sudo su "$USER" -c "id; cd $HOME/cf && cvd fetch --default_build=aosp-android-latest-release/aosp_cf_x86_64_only_phone-userdebug --target_directory=$HOME/cf" 2>&1 | tail -40
          ls -la "$HOME/cf" | head -60
          df -h .
          ls bin 2>/dev/null | head -40
          ./bin/launch_cvd --help 2>&1 | grep -iE -A2 -- '-(gpu_mode|vm_manager) ' | head -40 || true
      - name: Boot under crosvm, software GPU
        continue-on-error: true
        run: |
          cd "$HOME/cf"
          start=$(date +%s)
          sudo su "$USER" -c "cd $HOME/cf && HOME=$HOME/cf timeout 1500 ./bin/launch_cvd --daemon --gpu_mode=guest_swiftshader --report_anonymous_usage_stats=n --cpus=2 --memory_mb=4096" 2>&1 | tail -60
          echo "LAUNCH_EXIT=$? LAUNCH_SECONDS=$(( $(date +%s) - start ))"
          timeout 120 ./bin/adb wait-for-device || true
          ./bin/adb devices || true
          for p in ro.build.fingerprint ro.build.version.release ro.build.version.sdk ro.product.cpu.abilist sys.boot_completed ro.hardware.egl ro.hardware.vulkan ro.boot.hardware.gralloc ro.debuggable; do
            echo "PROP $p=$(./bin/adb shell getprop $p 2>&1)"
          done
          ./bin/adb shell 'dumpsys SurfaceFlinger | grep -i -m3 "GLES"' || true
          ./bin/adb shell 'ls /dev/input; getevent -pl 2>/dev/null | grep -E "add device|name:" | head -30' || true
          ps -eo comm,args | grep -E '^(crosvm|qemu)' | cut -c1-200 | head -3 || true
      - name: Stop, then boot under QEMU
        continue-on-error: true
        run: |
          cd "$HOME/cf"
          sudo su "$USER" -c "cd $HOME/cf && HOME=$HOME/cf ./bin/stop_cvd" 2>&1 | tail -2 || true
          ls bin | grep -i qemu || echo "no qemu in host package bin/"
          start=$(date +%s)
          sudo su "$USER" -c "cd $HOME/cf && HOME=$HOME/cf timeout 1200 ./bin/launch_cvd --daemon --vm_manager=qemu_cli --gpu_mode=guest_swiftshader --report_anonymous_usage_stats=n --cpus=2 --memory_mb=4096" 2>&1 | grep -vE 'casimir|log_tee' | tail -40
          echo "QEMU_LAUNCH_SECONDS=$(( $(date +%s) - start ))"
          timeout 120 ./bin/adb wait-for-device || true
          echo "PROP qemu sys.boot_completed=$(./bin/adb shell getprop sys.boot_completed 2>&1)"
          ps -eo comm,args | grep -E '^(crosvm|qemu)' | cut -c1-200 | head -3 || true
      - name: Logs on failure or success
        if: always()
        run: |
          cd "$HOME/cf" 2>/dev/null || exit 0
          f=$(find . /var/tmp/cvd -name launcher.log 2>/dev/null | head -n 1); grep -vE 'casimir|log_tee' "$f" | grep -E ' E |ERROR|BOOT|qemu|Detected unexpected' | tail -n 40 || true
          HOME="$HOME/cf" ./bin/stop_cvd 2>&1 | tail -3 || true
