# SPDX-License-Identifier: GPL-3.0-or-later
# GPU track, step G1 (docs/engine/E8-gpu-plan.md): can gfxstream's host
# library be built on its own, at a pinned commit, on both hosts?
# Exploratory: each job reports what happened and publishes the tail of its
# build log; a failed build does not fail the run.
name: gfxstream-build
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/gfxstream-build.yml"
      - "tools/gpu/**"
      - "core/device/src/bin/gamedroid-gpu-check.rs"
      - "Cargo.lock"
      - "core/device/**"
      - "tools/engine/scripts/install-and-play.script"
permissions:
  contents: write  # to publish the result to the ci-logs branch
env:
  GFXSTREAM_COMMIT: b8537e6d4db20caaa581d769a8543bddb377a30b
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Get gfxstream
        run: |
          git clone -q --filter=blob:none https://github.com/google/gfxstream "$HOME/gfxstream"
          git -C "$HOME/gfxstream" checkout -q "$GFXSTREAM_COMMIT"
          sudo apt-get update -qq
          sudo apt-get install -y -qq meson ninja-build cmake pkg-config libdrm-dev libegl-dev libgles-dev libvulkan-dev libx11-dev libx11-xcb-dev libxcb1-dev >/dev/null
      - name: Build with Meson
        run: |
          set +e
          mkdir -p "$HOME/out" && cd "$HOME/gfxstream"
          { meson setup -Ddefault_library=shared -Dgfxstream-build=host build-meson && meson compile -C build-meson; } > "$HOME/out/meson.log" 2>&1
          echo "MESON_EXIT=$?" | tee "$HOME/out/result.txt"
          find build-meson -name 'libgfxstream*' -type f -printf '%s %p\n' 2>/dev/null | tee -a "$HOME/out/result.txt"
          tail -n 60 "$HOME/out/meson.log" | cut -c1-300 > "$HOME/out/meson-tail.txt"
      - name: Build with CMake
        run: |
          set +e
          cd "$HOME/gfxstream" && mkdir -p build-cmake && cd build-cmake
          { cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release && ninja gfxstream_backend; } > "$HOME/out/cmake.log" 2>&1
          echo "CMAKE_EXIT=$?" | tee -a "$HOME/out/result.txt"
          find . -name 'libgfxstream*' -type f -printf '%s %p\n' 2>/dev/null | tee -a "$HOME/out/result.txt"
          tail -n 60 "$HOME/out/cmake.log" | cut -c1-300 > "$HOME/out/cmake-tail.txt"
      - name: Start the library against software renderers (G2a)
        run: |
          set +e
          # No GPU here: Mesa's software OpenGL ES (llvmpipe) and Vulkan (lavapipe).
          sudo apt-get install -y -qq libegl1 libgles2 libgl1-mesa-dri mesa-vulkan-drivers vulkan-tools >/dev/null
          {
            echo "=== starting gfxstream (Linux, software renderers)"
            vulkaninfo --summary 2>/dev/null | grep -E "deviceName|driverName" | head -n 4
            python3 tools/gpu/probe_gfxstream.py "$HOME/gfxstream/build-cmake/libgfxstream_backend.so" vulkan 2>&1 | cut -c1-240 | tail -n 30
          } > "$HOME/out/start.txt" 2>&1
          cat "$HOME/out/start.txt"
          # The mode gameDroid uses must start here.
          grep -q 'GFXSTREAM_START_VULKAN=PASS' "$HOME/out/start.txt"
      - uses: dtolnay/rust-toolchain@stable
      - name: Start it from gameDroid's own code
        run: |
          set -o pipefail
          cargo build --release -p gamedroid-device --bin gamedroid-gpu-check 2>&1 | tail -n 1
          timeout 120 target/release/gamedroid-gpu-check "$HOME/gfxstream/build-cmake/libgfxstream_backend.so" 2>&1 | cut -c1-240 | tee "$HOME/out/engine-start.txt"
      - name: Android and a game, drawn through the renderer (G3)
        env:
          GAME: com.shatteredpixel.shatteredpixeldungeon
          BVMM_NET_TRACE: "1"
        run: |
          set +e +o pipefail
          python3 tools/engine/fetch_fdroid_apk.py "$GAME" "$HOME/game.apk"
          sed "s/PACKAGE/$GAME/" tools/engine/scripts/install-and-play.script > "$HOME/play.script"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          cargo build --release -p gamedroid-device --bin gamedroid-run 2>&1 | tail -n 1
          export GAMEDROID_DATA="$RUNNER_TEMP/gd-data" GAMEDROID_STORAGE_GB=8
          cd "$HOME/out"
          timeout 420 "$GITHUB_WORKSPACE/target/release/gamedroid-run" --setup \
            --gpu "$HOME/gfxstream/build-cmake/libgfxstream_backend.so" \
            --memory 4096 --display 720x1280 --cmdline ignore_loglevel \
            --apk "$HOME/game.apk" --script "$HOME/play.script" > android.log 2> run.err
          {
            echo "RUN_EXIT=$? (0: the script ran and every expectation was met; 3: an expectation failed; 124: out of time)"
            echo "console lines: $(wc -l < android.log)"
            echo "=== the runner and the renderer"
            grep -vE "downloading,|unpacking|bvmm net:" run.err | awk '!seen[$0]++' | cut -c1-240 | head -n 40
            echo "=== milestones"
            for pat in 'virtio_gpu\|\[drm\]' 'init: starting service .surfaceflinger' 'sys.boot_completed=1'; do
              echo "[$(grep -c -- "$pat" android.log)] $pat :: $(grep -m1 -- "$pat" android.log | cut -c1-160)"
            done
            echo "=== the graphics driver in the kernel"
            grep -aE 'virtio_gpu|virtio-gpu|\[drm\]|shm|host visible|capset' android.log | cut -c1-200 | head -n 20
            echo "=== who is drawing, by Android's account"
            sed -n '/^GD_GPU_BEGIN/,/^GD_GPU_END/p' android.log | grep -v '^\[' | cut -c1-200 | head -n 14
            echo "=== graphics trouble in the console (deduplicated)"
            grep -aiE 'gfxstream|ranchu|vulkan|hwcomposer|surfaceflinger|gralloc|minigbm|angle' android.log | grep -aiE 'fail|error|fatal|abort|crash|died|SIG|unable|cannot|denied' | sed -E 's/^\[ *[0-9.]+\] //' | awk '!seen[$0]++' | cut -c1-230 | head -n 40
            echo "=== services that keep restarting"
            grep -oE "init: starting service '[^']+'" android.log | sort | uniq -c | sort -rn | head -n 8
          } > gpu-boot.txt 2>&1
          cat gpu-boot.txt
          for f in *.ppm; do [ -f "$f" ] && python3 "$GITHUB_WORKSPACE/tools/engine/ppm_to_png.py" "$f" "${f%.ppm}.png"; done
          # Android must boot, say the host renderer is drawing, and get the
          # game to the front.
          grep -q '^RUN_EXIT=0 ' gpu-boot.txt && grep -q 'GFXStream' gpu-boot.txt
      - name: Publish
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cd "$HOME/out" && "$GITHUB_WORKSPACE/tools/ci/publish-logs.sh" gfxstream-linux gpu-boot.txt lock.png after-swipe.png game-1.png game-2.png help.png result.txt meson-tail.txt cmake-tail.txt start.txt engine-start.txt
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Get gfxstream
        run: |
          git clone -q --filter=blob:none https://github.com/google/gfxstream "$RUNNER_TEMP/gfxstream"
          git -C "$RUNNER_TEMP/gfxstream" checkout -q "$GFXSTREAM_COMMIT"
          # A bug in gfxstream's Windows-only code at this commit: a
          # std::string handed to a printf-style log call. To report upstream.
          sed -i 's/mFeatures.VulkanAllocateHostMemory.getReason());/mFeatures.VulkanAllocateHostMemory.getReason().c_str());/' "$RUNNER_TEMP/gfxstream/host/vulkan/vk_common_operations.cpp"
          grep -c 'getReason().c_str());' "$RUNNER_TEMP/gfxstream/host/vulkan/vk_common_operations.cpp"
      - name: Build with CMake and ClangCL
        run: |
          set +e
          mkdir -p out
          OUT="$PWD/out"
          cd "$RUNNER_TEMP/gfxstream" && mkdir -p build && cd build
          # windows.h must not pull in the old winsock.h ahead of WinSock2.h;
          # gfxstream's Bazel build defines this, its CMake build does not.
          export CFLAGS="-DWIN32_LEAN_AND_MEAN" CXXFLAGS="-DWIN32_LEAN_AND_MEAN"
          { cmake .. -A x64 -T ClangCL && cmake --build . --config Release --target gfxstream_backend -- -m -v:m; } > "$OUT/cmake.log" 2>&1
          echo "CMAKE_EXIT=$?" | tee "$OUT/result.txt"
          echo "--- libraries the DLL asks Windows for" >> "$OUT/result.txt"
          find . -iname '*gfxstream_backend*.dll' | head -n 1 | while read -r f; do objdump -p "$f" | grep 'DLL Name' | sort -u >> "$OUT/result.txt"; done
          find . -iname '*gfxstream_backend*.dll' -o -iname '*gfxstream_backend*.lib' | while read -r f; do echo "$(stat -c %s "$f") $f"; done | tee -a "$OUT/result.txt"
          grep -E "error [A-Z0-9]*:|error :|fatal error" "$OUT/cmake.log" | sed -E 's/ \[[^]]*vcxproj\]$//' | awk '!seen[$0]++' | cut -c1-260 | head -n 60 > "$OUT/cmake-errors.txt"
          tail -n 60 "$OUT/cmake.log" | cut -c1-300 > "$OUT/cmake-tail.txt"
      - name: Try to start the library (G2a)
        # Reported, never failing: this runner has no GPU and no Vulkan
        # driver, so the start cannot succeed here. Only the mode gameDroid
        # uses (Vulkan only) is tried.
        run: |
          set +e +o pipefail
          dll="$(find "$RUNNER_TEMP/gfxstream/build" -iname 'gfxstream_backend.dll' | head -n 1)"
          {
            echo "=== starting gfxstream (Windows runner: no GPU, no Vulkan driver)"
            echo "library: $dll"
            [ -n "$dll" ] && python tools/gpu/probe_gfxstream.py "$(cygpath -w "$dll")" vulkan 2>&1 | cut -c1-240 | tail -n 30
          } > out/start.txt 2>&1
          cat out/start.txt
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gfxstream-windows
          if-no-files-found: ignore
          path: ${{ runner.temp }}/gfxstream/build/**/*gfxstream_backend*.dll
      - name: Publish
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cd out && "$GITHUB_WORKSPACE/tools/ci/publish-logs.sh" gfxstream-windows result.txt cmake-errors.txt cmake-tail.txt start.txt
