# SPDX-License-Identifier: GPL-3.0-or-later
# Engine track, milestone E2. More memory than fits below 4 GiB, and several
# virtual processors, with a virtio disk still working. KVM runs both parts;
# WHP runs the memory part (it has one processor for now).
name: engine-smp-mem
on:
  workflow_dispatch:
    inputs:
      bcontain_ref:
        description: "Branch, tag or commit of inputloop/bcontain to test"
        default: "claude/gifted-ramanujan-i2r9yh"
  push:
    paths:
      - ".github/workflows/engine-smp-mem.yml"
permissions:
  contents: read
env:
  BCONTAIN_REF: ${{ inputs.bcontain_ref || 'claude/gifted-ramanujan-i2r9yh' }}
  BCONTAIN_KERNEL_ARGS: ignore_loglevel
  GUEST_SCRIPT: "echo CPUS=$(grep -c ^processor /proc/cpuinfo); grep MemTotal /proc/meminfo; head -c 14 /dev/vda; echo; grep -i virtio /proc/interrupts; echo GUEST-DONE"
jobs:
  kvm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: inputloop/bcontain
          ref: ${{ env.BCONTAIN_REF }}
      - run: git log -1 --format='bcontain %H %s'
      - uses: dtolnay/rust-toolchain@stable
      - name: Open /dev/kvm to the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - run: cargo build --release -p bcontain
      - run: cargo test -p bvmm
      - run: ./target/release/bcontain kernel fetch
      - name: Boot with 4 processors and 5 GiB (E2)
        run: |
          set +e
          printf 'BVMM-DISK-TEST' > disk.img && truncate -s 64M disk.img
          export BCONTAIN_NATIVE_DISKS="$PWD/disk.img"
          ./target/release/bcontain run --help | grep -iE 'cpus|memory' | head -4
          timeout 120 ./target/release/bcontain run --engine native --cpus 4 --memory 5G alpine:3.20 -- sh -c "$GUEST_SCRIPT" > boot.log 2>&1
          echo "EXIT=$?"
          echo "--- kernel lines about processors and memory"
          grep -iE 'smp|cpu|e820|memory:|x2apic|apic' boot.log | cut -c1-180 | head -n 50
          echo "--- last 25 lines"
          tail -n 25 boot.log | cut -c1-180
          ok=1
          grep -q '^CPUS=4' boot.log || { echo "FAIL: guest does not see 4 processors"; ok=0; }
          kb=$(grep -m1 '^MemTotal' boot.log | awk '{print $2}')
          echo "MEMTOTAL_KB=$kb"
          [ "${kb:-0}" -gt 4700000 ] || { echo "FAIL: guest sees too little memory"; ok=0; }
          grep -q '^BVMM-DISK-TEST' boot.log || { echo "FAIL: disk read failed"; ok=0; }
          if [ "$ok" = 1 ]; then echo "E2_KVM=PASS"; else echo "E2_KVM=FAIL"; exit 1; fi
  whp:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: inputloop/bcontain
          ref: ${{ env.BCONTAIN_REF }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p bcontain
      - run: cargo test -p bvmm
      - run: .\target\release\bcontain.exe kernel fetch
      - name: Boot with 5 GiB (E2, memory part)
        shell: pwsh
        timeout-minutes: 4
        continue-on-error: true
        run: |
          $fs = [IO.File]::Create("$PWD\disk.img")
          $b = [Text.Encoding]::ASCII.GetBytes("BVMM-DISK-TEST")
          $fs.Write($b, 0, $b.Length); $fs.SetLength(64MB); $fs.Close()
          $env:BCONTAIN_NATIVE_DISKS = "$PWD\disk.img"
          & .\target\release\bcontain.exe run --engine native --memory 5G alpine:3.20 -- sh -c $env:GUEST_SCRIPT *> boot.log
          "EXIT=$LASTEXITCODE"
          exit 0
      - name: Check the result
        shell: pwsh
        run: |
          "--- kernel lines about memory"
          Select-String -Path boot.log -Pattern 'e820|Memory:' | Select-Object -First 20 | ForEach-Object { $l = $_.Line; if ($l.Length -gt 180) { $l.Substring(0,180) } else { $l } }
          "--- last 25 lines"
          Get-Content boot.log -Tail 25 | ForEach-Object { if ($_.Length -gt 180) { $_.Substring(0,180) } else { $_ } }
          $ok = $true
          $m = Select-String -Path boot.log -Pattern '^MemTotal:\s+(\d+)' | Select-Object -First 1
          $kb = if ($m) { [int64]$m.Matches[0].Groups[1].Value } else { 0 }
          "MEMTOTAL_KB=$kb"
          if ($kb -le 4700000) { "FAIL: guest sees too little memory"; $ok = $false }
          if (-not (Select-String -Path boot.log -Pattern '^BVMM-DISK-TEST' -Quiet)) { "FAIL: disk read failed"; $ok = $false }
          if ($ok) { "E2_WHP_MEMORY=PASS"; exit 0 } else { "E2_WHP_MEMORY=FAIL"; exit 1 }
