# SPDX-License-Identifier: GPL-3.0-or-later
# Engine track, milestone E5. Boot the stock Android 17 image on bvmm.
# gamedroid-run --setup does everything a user's first run does: download
# the image from the public build site, unpack it, prepare it (what
# Cuttlefish's bootloader would do) and boot it on the bvmm engine.
# Both hosts must pass. Each asks for a different amount of storage for
# games and data, and the run reports how much Android then sees.
name: engine-android
on:
  workflow_dispatch:
    inputs:
      game:
        description: "F-Droid package to install and start"
        default: "com.shatteredpixel.shatteredpixeldungeon"
      seconds:
        description: "How long to let Android run"
        default: "420"
  push:
    paths:
      - ".github/workflows/engine-android.yml"
      - "tools/engine/ppm_to_png.py"
      - "tools/engine/fetch_fdroid_apk.py"
      - "tools/ci/publish-logs.sh"
      - "tools/engine/scripts/**"
      - "core/device/**"
      - "Cargo.lock"
permissions:
  contents: write  # to publish logs and the screenshot to the ci-logs branch
env:
  RUN_SECONDS: ${{ inputs.seconds || '420' }}
  GAME: ${{ inputs.game || 'com.shatteredpixel.shatteredpixeldungeon' }}
jobs:
  android:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: engine-android, os: ubuntu-24.04, py: python3, cpus: 2, seconds: 420, storage: 12, required: true }
          - { name: engine-android-windows, os: windows-latest, py: python, cpus: 1, seconds: 1500, storage: 20, required: true }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      PY: ${{ matrix.py }}
      GAMEDROID_STORAGE_GB: ${{ matrix.storage }}
    steps:
      - uses: actions/checkout@v4
      - name: Choose the data folder
        run: echo "GAMEDROID_DATA=$RUNNER_TEMP/gd-data" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build gamedroid-run
        run: |
          cargo build --release -p gamedroid-device --bin gamedroid-run
          grep -A3 'name = "bvmm"' Cargo.lock | grep source
      - name: Host setup (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Fetch a free-software game from F-Droid
        run: |
          mkdir -p "$GAMEDROID_DATA/run" && cd "$GAMEDROID_DATA/run"
          "$PY" "$GITHUB_WORKSPACE/tools/engine/fetch_fdroid_apk.py" "$GAME" game.apk
          ls -la game.apk
          sed "s/PACKAGE/$GAME/" "$GITHUB_WORKSPACE/tools/engine/scripts/install-and-play.script" > play.script
      - name: First run, download, prepare and boot Android on bvmm (E5)
        run: |
          set +e
          cd "$GAMEDROID_DATA/run"
          df -h . | tail -1
          SECONDS_ALLOWED="${{ matrix.seconds }}"
          [ -n "${{ inputs.seconds }}" ] && [ "${{ matrix.required }}" = "true" ] && SECONDS_ALLOWED="${{ inputs.seconds }}"
          timeout "$SECONDS_ALLOWED" "$GITHUB_WORKSPACE/target/release/gamedroid-run" --setup \
            --cpus ${{ matrix.cpus }} --memory 4096 --display 720x1280 --screenshot screen.ppm \
            --cmdline ignore_loglevel \
            --apk game.apk --script play.script > android.log 2> bvmm.err
          echo "EXIT=$? (0: the script ran and every expectation was met; 3: an expectation failed; 124: out of time)"
          echo "LINES=$(wc -l < android.log)"
          echo "--- setup and runner messages"; grep -v 'downloading,' bvmm.err | cut -c1-300 | head -n 20; cut -c1-300 bvmm.err | tail -n 20
          P="$GAMEDROID_DATA/images/16644040/prepared"
          cp "$P/cmdline.txt" "$P/bootconfig.txt" "$P/os.layout" . 2>/dev/null
          ls -la "$P" "$P/.."
          df -h . | tail -1
      - name: How far did it get
        if: always()
        run: |
          set +e
          cd "$GAMEDROID_DATA/run"
          exec > >(tee summary.txt) 2>&1
          show() { cut -c1-230 | sed 's/\r$//'; }
          echo "=== milestones"
          for pat in 'Linux version' 'virtio_blk virtio' 'vda: ' 'virtio_gpu\|virtio-gpu\|\[drm\]' 'Run /init as init process' 'init: init first stage started' 'Switching root' 'init: init second stage started' 'init: starting service .zygote' 'init: starting service .surfaceflinger' 'system_server' 'ISensors' 'sys.boot_completed=1'; do
            n=$(grep -c -- "$pat" android.log); l=$(grep -m1 -- "$pat" android.log | show)
            echo "[$n] $pat :: $l"
          done
          if grep -q 'sys.boot_completed=1' android.log; then echo "E5_${{ runner.os }}=PASS (Android reported boot completed)"; else echo "E5_${{ runner.os }}=FAIL"; fi
          echo "=== first-stage init and mounts (first 60)"
          grep -E 'init: |fs_mgr|avb|dm-|device-mapper|EXT4-fs|F2FS|erofs|super|by-name' android.log | show | head -n 60
          echo "=== errors and failures (first 70, deduplicated by message)"
          grep -iE 'panic|fatal|failed|error|unable|cannot|timed out|critical|rebooting|Restarting system|BUG:|Oops|segfault' android.log | sed -E 's/^\[ *[0-9.]+\]//' | awk '!seen[$0]++' | show | head -n 70
          echo "=== services that keep restarting"
          grep -oE "init: starting service '[^']+'" android.log | sort | uniq -c | sort -rn | head -n 20
          echo "=== last 60 lines"
          tail -n 60 android.log | show
          echo "=== screen"
          ls *.ppm >/dev/null 2>&1 || echo "the guest never presented a frame"
          for f in *.ppm; do
            [ -f "$f" ] || continue
            echo "$f: $("$PY" "$GITHUB_WORKSPACE/tools/engine/ppm_to_png.py" "$f" "${f%.ppm}.png")"
          done
          echo "=== runner messages"; cat bvmm.err | cut -c1-200 | tail -n 25
          echo "=== storage for games and data (asked for ${GAMEDROID_STORAGE_GB:-the default} GB)"
          grep -m1 -oE 'GD_DATA_KB=[0-9]+' android.log
          grep -iE 'userdata|/data' android.log | grep -iE 'format|mkfs|f2fs|ext4|wipe|mount' | cut -c1-200 | head -n 12
          echo "=== shell and install lines from the console"
          grep -nE 'GD_|uid=|pm install|Success|Failure|INSTALL_|Events injected|monkey' android.log | cut -c1-220 | tail -n 30
      - name: Publish the logs to the ci-logs branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$GAMEDROID_DATA/run" && cut -c1-400 android.log > android-log.txt 2>/dev/null || true
          "$GITHUB_WORKSPACE/tools/ci/publish-logs.sh" ${{ matrix.name }} summary.txt android-log.txt bvmm.err cmdline.txt bootconfig.txt screen.png lock.png after-swipe.png game-1.png game-2.png
      - name: Verdict
        if: matrix.required
        run: |
          grep -q 'sys.boot_completed=1' "$GAMEDROID_DATA/run/android.log"
          grep -q 'script finished' "$GAMEDROID_DATA/run/bvmm.err"
          ! grep -q 'EXPECT FAILED' "$GAMEDROID_DATA/run/bvmm.err"
