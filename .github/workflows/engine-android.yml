# SPDX-License-Identifier: GPL-3.0-or-later
# Engine track, milestone E5. Boot the stock Android 17 image on bvmm.
# The image set is prepared by tools/engine/android_prepare.py (which does
# what Cuttlefish's bootloader would) and started with gamedroid-run, which
# describes the machine and runs it on the bvmm engine.
# KVM only for now. Exploratory: it reports how far Android gets.
name: engine-android
on:
  workflow_dispatch:
    inputs:
      seconds:
        description: "How long to let Android run"
        default: "300"
  push:
    paths:
      - ".github/workflows/engine-android.yml"
      - "tools/engine/android_prepare.py"
      - "tools/engine/test_android_prepare.py"
      - "tools/engine/ppm_to_png.py"
      - "tools/ci/publish-logs.sh"
      - "core/device/**"
      - "Cargo.lock"
permissions:
  contents: write  # to publish logs and the screenshot to the ci-logs branch
env:
  RUN_SECONDS: ${{ inputs.seconds || '300' }}
jobs:
  kvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Tool tests
        run: python3 -W error tools/engine/test_android_prepare.py
      - uses: dtolnay/rust-toolchain@stable
      - name: Build gamedroid-run
        run: |
          cargo build --release -p gamedroid-device --bin gamedroid-run
          grep -A3 'name = "bvmm"' Cargo.lock | grep source
      - name: Host setup and image fetch
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo curl -fsSL https://us-apt.pkg.dev/doc/repo-signing-key.gpg -o /etc/apt/trusted.gpg.d/artifact-registry.asc
          echo "deb https://us-apt.pkg.dev/projects/android-cuttlefish-artifacts android-cuttlefish main" | sudo tee /etc/apt/sources.list.d/artifact-registry.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq cuttlefish-base cuttlefish-user >/dev/null
          mkdir -p "$HOME/cf"
          cvd fetch --default_build=aosp-android-latest-release/aosp_cf_x86_64_only_phone-userdebug --target_directory="$HOME/cf" 2>&1 | tail -2
          df -h / | tail -1
      - name: Prepare the image set for bvmm
        run: |
          python3 tools/engine/android_prepare.py "$HOME/cf" "$HOME/gd" --memory-mib 4096
          sed -i 's/$/ ignore_loglevel/' "$HOME/gd/cmdline.txt"
          echo "--- cmdline"; cat "$HOME/gd/cmdline.txt"
          echo "--- bootconfig from the image (first 30 lines)"; head -n 30 "$HOME/gd/bootconfig.txt"
          echo "--- layout"; cat "$HOME/gd/os.layout"
          ls -la "$HOME/gd"
      - name: Boot Android on bvmm (E5)
        run: |
          set +e
          cd "$HOME/gd"
          timeout "$RUN_SECONDS" "$GITHUB_WORKSPACE/target/release/gamedroid-run" . \
            --cpus 2 --memory 4096 --display 720x1280 --screenshot screen.ppm > android.log 2> bvmm.err
          echo "EXIT=$? (124 means it was still running when time was up)"
          echo "LINES=$(wc -l < android.log)"
          echo "--- bvmm messages"; cut -c1-300 bvmm.err | tail -n 20
      - name: How far did it get
        if: always()
        run: |
          set +e
          cd "$HOME/gd"
          exec > >(tee summary.txt) 2>&1
          show() { cut -c1-230 | sed 's/\r$//'; }
          echo "=== milestones"
          for pat in 'Linux version' 'virtio_blk virtio' 'vda: ' 'virtio_gpu\|virtio-gpu\|\[drm\]' 'Run /init as init process' 'init: init first stage started' 'Switching root' 'init: init second stage started' 'init: starting service .zygote' 'init: starting service .surfaceflinger' 'system_server' 'ISensors' 'sys.boot_completed=1'; do
            n=$(grep -c -- "$pat" android.log); l=$(grep -m1 -- "$pat" android.log | show)
            echo "[$n] $pat :: $l"
          done
          if grep -q 'sys.boot_completed=1' android.log; then echo "E5_KVM=PASS (Android reported boot completed)"; else echo "E5_KVM=FAIL"; fi
          echo "=== first-stage init and mounts (first 60)"
          grep -E 'init: |fs_mgr|avb|dm-|device-mapper|EXT4-fs|F2FS|erofs|super|by-name' android.log | show | head -n 60
          echo "=== errors and failures (first 70, deduplicated by message)"
          grep -iE 'panic|fatal|failed|error|unable|cannot|timed out|critical|rebooting|Restarting system|BUG:|Oops|segfault' android.log | sed -E 's/^\[ *[0-9.]+\]//' | awk '!seen[$0]++' | show | head -n 70
          echo "=== services that keep restarting"
          grep -oE "init: starting service '[^']+'" android.log | sort | uniq -c | sort -rn | head -n 20
          echo "=== last 60 lines"
          tail -n 60 android.log | show
          echo "=== screen"
          if [ -f screen.ppm ]; then
            python3 "$GITHUB_WORKSPACE/tools/engine/ppm_to_png.py" screen.ppm screen.png && ls -la screen.png
          else
            echo "the guest never presented a frame"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-on-bvmm-log
          path: |
            ~/gd/android.log
            ~/gd/bvmm.err
            ~/gd/cmdline.txt
            ~/gd/bootconfig.txt
            ~/gd/os.layout
            ~/gd/screen.png
      - name: Publish the logs to the ci-logs branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$HOME/gd" && cut -c1-400 android.log > android-log.txt 2>/dev/null || true
          "$GITHUB_WORKSPACE/tools/ci/publish-logs.sh" engine-android summary.txt android-log.txt bvmm.err cmdline.txt bootconfig.txt screen.png
      - name: Verdict
        run: grep -q 'sys.boot_completed=1' "$HOME/gd/android.log"
