# SPDX-License-Identifier: GPL-3.0-or-later
# Engine track, milestone E0. Builds bvmm from inputloop/bcontain and runs it
# on real hardware virtualization: KVM on the Linux runner, Windows Hypervisor
# Platform on the Windows runner. A green run means every step passed.
name: engine-bvmm
on:
  workflow_dispatch:
    inputs:
      bcontain_ref:
        description: "Branch, tag or commit of inputloop/bcontain to test"
        default: "main"
  push:
    paths:
      - ".github/workflows/engine-bvmm.yml"
permissions:
  contents: read
env:
  BCONTAIN_REF: ${{ inputs.bcontain_ref || 'main' }}
jobs:
  kvm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: inputloop/bcontain
          ref: ${{ env.BCONTAIN_REF }}
      - run: git log -1 --format='bcontain %H %s'
      - uses: dtolnay/rust-toolchain@stable
      - name: Open /dev/kvm to the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - run: cargo build --release -p bcontain
      - name: Unit tests
        run: cargo test -p bvmm
      - name: hypervisor-test (40-byte guest)
        run: ./target/release/bcontain hypervisor-test
      - name: Fetch guest kernel
        run: ./target/release/bcontain kernel fetch
      - name: Boot a container on bvmm (E0)
        run: |
          set +e
          timeout 120 ./target/release/bcontain run --engine native alpine:3.20 -- uname -a 2>&1 | tee boot.log | tail -n 80
          echo "EXIT=${PIPESTATUS[0]}"
          if grep -q "^Linux " boot.log; then echo "E0_KVM=PASS"; else echo "E0_KVM=FAIL"; exit 1; fi
  whp:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: inputloop/bcontain
          ref: ${{ env.BCONTAIN_REF }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p bcontain
      - name: Unit tests
        run: cargo test -p bvmm
      - name: hypervisor-test (40-byte guest)
        run: .\target\release\bcontain.exe hypervisor-test
      - name: Fetch guest kernel
        run: .\target\release\bcontain.exe kernel fetch
      - name: Boot a container on bvmm (E0)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\target\release\bcontain.exe -ArgumentList 'run','--engine','native','alpine:3.20','--','uname','-a' -RedirectStandardOutput boot.log -RedirectStandardError boot.err -PassThru -NoNewWindow
          if (-not $p.WaitForExit(120000)) { $p.Kill(); "TIMEOUT after 120 s" }
          Get-Content boot.log -Tail 80 -ErrorAction SilentlyContinue
          Get-Content boot.err -Tail 40 -ErrorAction SilentlyContinue
          if (Select-String -Path boot.log -Pattern '^Linux ' -Quiet) { "E0_WHP=PASS"; exit 0 } else { "E0_WHP=FAIL"; exit 1 }
