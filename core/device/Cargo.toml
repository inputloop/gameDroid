# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "gamedroid-device"
description = "gameDroid's virtual Android device: the machine Android runs in, built on the bvmm engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The engine. Pinned by Cargo.lock; `cargo update -p bvmm` moves it.
bvmm = { git = "https://github.com/inputloop/bcontain", branch = "claude/gifted-ramanujan-i2r9yh" }

# For setting up on first run: fetching the Android image and unpacking it.
ureq = { version = "2", default-features = false, features = ["tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "gamedroid-run"
path = "src/bin/gamedroid-run.rs"
