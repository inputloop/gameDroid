# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "gamedroid"
description = "gameDroid: Android in a window, played with keyboard and mouse"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gamedroid-input = { path = "../core/input" }
gamedroid-device = { path = "../core/device" }
bvmm = { git = "https://github.com/inputloop/bcontain", branch = "claude/gifted-ramanujan-i2r9yh" }
# X11 only on Linux for now: it needs no extra development packages to build.
minifb = { version = "0.28", default-features = false, features = ["x11"] }
# The host's speakers and microphones. WASAPI on Windows (no C libraries);
# ALSA on Linux (needs libasound2-dev to build).
cpal = "0.15"
